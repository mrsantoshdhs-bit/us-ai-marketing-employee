[project]
name = "aime"
version = "0.1.0"
description = "Autonomous US AI Marketing Employee: research, content, CRM, lead qualification and reporting agents"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pillow>=10.4",
    "tzdata>=2024.1",
    "cryptography>=43",
    "pyspellchecker>=0.8",
]

[project.scripts]
aime = "aime.cli:main"

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
# pyflakes, syntax errors, bugbear, and bandit security rules
select = ["F", "E9", "B", "S"]
# S101 assert, S311 non-crypto random, S603/S607 subprocess with fixed args, S110/S112 intentional pass/continue
ignore = ["S101", "S311", "S603", "S607", "S110", "S112", "S310"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S314"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
