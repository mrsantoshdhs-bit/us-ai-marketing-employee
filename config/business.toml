# Business configuration for the AI marketing employee.
# Edit freely; the agents read this file on every run.

[company]
# Marketing brand name: appears in generated content, images and email drafts.
name = "Digital Hub Solution"
# Legal entity name, kept unchanged for compliance records; not used in marketing content.
legal_name = "Digital Hub Solution Private Limited"
# Leave empty until you have a real URL to publish; nothing is invented here.
website = ""
tagline = "Custom CRM, AI agents and automation for US businesses"

[targeting]
country = "US"
# "ALL" = all 50 states, or a list such as ["CA", "TX", "NY"]
states = "ALL"
industries = [
    "saas",
    "real_estate",
    "marketing_agencies",
    "professional_services",
    "b2b_sales",
    "tech_startups",
    "ecommerce",
    "smb",
]
services = [
    "custom_crm",
    "ai_agents",
    "agent_orchestration",
    "bpa",
    "sales_automation",
    "leadgen_automation",
    "saas_dev",
    "custom_software",
    "ai_consulting",
]

[content]
posts_per_week = 3
posting_days = ["Tue", "Wed", "Thu"]
posting_time = "09:30"
timezone = "America/New_York"
queue_horizon_days = 14
max_pending_items = 9
max_posts_per_generation_run = 3
max_hashtags = 5
min_words = 70
max_words = 260

[research]
max_new_companies_per_run = 40
states_per_run = 5
industries_per_run = 2
cache_hours = 12
# Monthly HN "Who is hiring?" threads to read (current + previous)
hn_threads = 2
# Company homepages verified per run (one polite request each)
website_checks_per_run = 25

[qualification]
grade_a = 75
grade_b = 55
grade_c = 35

[publishing]
max_posts_per_run = 1
# Approved posts whose slot passed by more than this are rescheduled instead of burst-published.
max_overdue_hours = 24

[enrichment]
# Company research reads each company's own website (robots.txt honoured) and SEC filings.
companies_per_run = 15
max_pages_per_site = 6
recheck_days = 30

[publish_policy]
# SHADOW MODE ONLY. The policy records what it WOULD do with each post ("would publish" or
# "would hold" with reasons) so its judgement can be compared with yours. It never approves,
# schedules or publishes anything; a person still approves every post. "shadow" is the only mode.
mode = "shadow"
# Services the policy may publish without a person (empty = all services).
allowed_services = []
# Designed (browser-rendered) images only; simple fallback cards always go to a person.
require_designed_image = true
max_posts_per_week = 3
min_hours_between_posts = 20
# Drafts older than this go back to a person even if they passed every check.
max_draft_age_days = 14
# Posts mentioning any of these always go to a person.
hold_terms = ["guarantee", "pricing", "price", "discount", "free trial", "case study", "our client",
              "customer story", "testimonial", "award", "certified"]

[followup]
max_touches = 3
intervals_days = [0, 3, 7]
send_window_start = "08:00"
send_window_end = "18:00"
send_window_timezone = "America/New_York"
stale_lead_days = 30
