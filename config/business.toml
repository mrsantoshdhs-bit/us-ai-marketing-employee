# Business configuration for the AI marketing employee.
# Edit freely; the agents read this file on every run.

[company]
# Marketing brand name: appears in generated content, images and email drafts.
name = "Digital Hub Solution"
# Legal entity name, kept unchanged for compliance records; not used in marketing content.
legal_name = "Digital Hub Solution Private Limited"
# Leave empty until you have a real URL to publish; nothing is invented here.
website = ""
tagline = "Custom CRM, AI agents and automation for US businesses"

[targeting]
country = "US"
# "ALL" = all 50 states, or a list such as ["CA", "TX", "NY"]
states = "ALL"
industries = [
    "saas",
    "real_estate",
    "marketing_agencies",
    "professional_services",
    "b2b_sales",
    "tech_startups",
    "ecommerce",
    "smb",
]
services = [
    "custom_crm",
    "ai_agents",
    "agent_orchestration",
    "bpa",
    "sales_automation",
    "leadgen_automation",
    "saas_dev",
    "custom_software",
    "ai_consulting",
]

[content]
posts_per_week = 3
posting_days = ["Tue", "Wed", "Thu"]
posting_time = "09:30"
timezone = "America/New_York"
queue_horizon_days = 14
max_pending_items = 9
max_posts_per_generation_run = 3
max_hashtags = 5
min_words = 70
max_words = 260

[research]
max_new_companies_per_run = 40
states_per_run = 5
industries_per_run = 2
cache_hours = 12
# Monthly HN "Who is hiring?" threads to read (current + previous)
hn_threads = 2
# Company homepages verified per run (one polite request each)
website_checks_per_run = 25
# A few more checks in every 30-minute intake run, so new companies are checked within hours (0 turns it off)
website_checks_per_inbound_run = 5

[qualification]
grade_a = 75
grade_b = 55
grade_c = 35

[publishing]
max_posts_per_run = 1
# Approved posts whose slot passed by more than this are rescheduled instead of burst-published.
max_overdue_hours = 24

[outreach]
# B2B first-touch emails to researched decision-makers (owner decision, 26 Oct 2026). Drafts quote only
# what the company published; every email needs your approval; nothing is sent while
# OUTBOUND_EMAIL_ENABLED=false.
b2b_enabled = true
drafts_per_run = 10
min_grade = "B"
# Day offsets of the 3 steps (first email, follow-up, close-the-loop); each step needs approval.
intervals_days = [0, 4, 10]
max_touches = 3
# Also draft to a published company inbox (info@, hello@ ...) when no named person has an email.
include_company_inboxes = true
# Sending limits for approved outreach (replies to people who wrote to us are not limited).
daily_send_limit = 20
per_domain_daily_limit = 1
sends_per_run = 5
# Every email from the sales mailbox (outreach, follow-ups, answers) in a rolling 24 hours: protects the mailbox's
# reputation whatever the mix. Emails over it wait, they are not cancelled.
mailbox_daily_limit = 50

[meetings]
# A4 meeting booking (off unless CALENDAR_PROVIDER and MEETING_BOOKING_ENABLED are set in .env).
owner_timezone = "Asia/Kolkata"   # the owner's own working hours below are in this zone
owner_hours = "08:00-23:30"       # the owner takes calls between these local times (US mornings are Indian evenings)
prospect_hours = "09:00-17:00"    # slots fall inside the prospect's business hours, on their weekdays
slot_minutes = 30
days_ahead = 5                    # look this many weekdays ahead
slots_offered = 3                 # at most one per day, so the prospect has a real choice
min_notice_hours = 24
reminder_hours = 24               # an alert for the Sales Manager this long before each meeting
remind_prospect = false           # also draft a reminder email for the prospect (it waits for approval)

[handover]
# Who receives new deals (interested prospects, booked meetings): these usernames, or, when empty, every active user
# whose role receives leads (Administration › Users). People marked unavailable or at their capacity are skipped.
# Set by the Super Admin in Settings › Sales settings.
sales_manager = []
strategy = "workload"             # workload (fewest open deals) | round_robin | skill (their services first)
escalate_after_hours = 24         # a deal its owner has not touched for this long: their manager is told (0 = never)

[pipeline]
# Open stages in order with their win probability (%). new and discovery stay (the agents open deals there); won and
# lost always follow. Changed by the Super Admin in Settings › Sales settings.
stages = "new:10, discovery:20, proposal:50, negotiation:70"
# Open opportunities with nothing logged for this long get a "decide the next step" task.
stalled_days = 10
# After the last outreach email, wait this long for a reply before marking "no response" (lead -> nurture).
no_response_days = 7

[enrichment]
# Company research reads each company's own website (robots.txt honoured) and SEC filings.
companies_per_run = 15
max_pages_per_site = 6
recheck_days = 30

[publish_policy]
# SHADOW MODE ONLY. The policy records what it WOULD do with each post ("would publish" or
# "would hold" with reasons) so its judgement can be compared with yours. It never approves,
# schedules or publishes anything; a person still approves every post. "shadow" is the only mode.
mode = "shadow"
# Services the policy may publish without a person (empty = all services).
allowed_services = []
# Designed (browser-rendered) images only; simple fallback cards always go to a person.
require_designed_image = true
max_posts_per_week = 3
min_hours_between_posts = 20
# Drafts older than this go back to a person even if they passed every check.
max_draft_age_days = 14
# Posts mentioning any of these always go to a person.
hold_terms = ["guarantee", "pricing", "price", "discount", "free trial", "case study", "our client",
              "customer story", "testimonial", "award", "certified"]

[followup]
max_touches = 3
intervals_days = [0, 3, 7]
send_window_start = "08:00"
send_window_end = "18:00"
send_window_timezone = "America/New_York"
stale_lead_days = 30
